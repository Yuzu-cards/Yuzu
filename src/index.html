<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#15120d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Yuzu" />
  <title>Yuzu</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/crest.svg" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preload" href="fonts/yuzu-pixel.woff" as="font" type="font/woff" crossorigin />
  <script>/* interface, text size and colours before the first paint (device settings) */try{var d=document.documentElement,l=localStorage;d.dataset.ui=l.getItem("yuzu-ui")||"arcade";d.dataset.size=l.getItem("yuzu-size")||"normal";var t=l.getItem("yuzu-theme");if(t)d.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="__CSS__" />
  <script type="module" src="__JS__"></script>
</head>
<body>
  <!-- build __VERSION__ -->
  <div id="root"></div>
  <noscript>Yuzu needs JavaScript.</noscript>
</body>
</html>
